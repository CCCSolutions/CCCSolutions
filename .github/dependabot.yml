version: 2
updates:
  - package-ecosystem: bun
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint pins `typescript: <6.1.0`, so TS 7 crashes eslint with
      # "Cannot read properties of undefined (reading 'Cjs')". Drop this once
      # typescript-eslint ships TS 7 support.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: bun
    directory: /website
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
