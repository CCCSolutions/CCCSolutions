name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (typecheck + lint + format + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun's global module cache, keyed on the lockfile.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('backend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # worker-configuration.d.ts is gitignored; regenerate it before tsc.
      - name: Generate Worker types
        run: bun run cf-typegen

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint (eslint)
        run: bun run lint

      - name: Format check (prettier)
        run: bun run format:check

      - name: Test (vitest)
        run: bunx vitest run

  guard-test-data:
    name: guard against committing test_data
    runs-on: ubuntu-latest
    # PR-only: needs the base ref to diff against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if the PR adds website/public/past_contests test_data
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          offenders=$(git diff --name-only --diff-filter=A "$base" "$head" \
            | grep -E '^website/public/past_contests/.*/test_data(/|$)' || true)
          if [ -n "$offenders" ]; then
            echo "::error::This PR adds test_data paths under website/public/past_contests (these 3.7GB files must not be committed):"
            echo "$offenders"
            exit 1
          fi
          echo "OK: no website/public/past_contests test_data paths added."
