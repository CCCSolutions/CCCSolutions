name: PR Format

on:
  pull_request:
    # Re-run when the title/body change, not just on new commits.
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Lint PR title for Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  pr-body:
    name: Non-empty PR body
    runs-on: ubuntu-latest
    steps:
      - name: Fail on empty PR description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::PR description is empty. Add a summary of what changed and why."
            exit 1
          fi
          echo "OK: PR description is non-empty."
